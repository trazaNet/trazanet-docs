version: '3.8'

services:
  # Backend API
  api:
    build:
      context: ../../trazanet-api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ../../trazanet-api/src:/app/src:ro
    restart: unless-stopped

  # Web Frontend
  web:
    build:
      context: ../../trazanet-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - API_URL=http://api:4000
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: trazanet-network
